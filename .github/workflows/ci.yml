name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Runs a task branch on demand without opening a pull request.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CPSAT_CACHE_DIR: ${{ github.workspace }}/.cpsat-cache

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  tombi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # no major-version tag exists
      - run: uvx tombi@1.8.4 format --quiet --check .

  oxfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bunx oxfmt --check

  just-fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just --fmt --check

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .cpsat-cache
          key:
            ortools-${{ runner.os }}-${{
            hashFiles('crates/cpsat-sys/build/artifacts.rs') }}
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just lint

  docs:
    runs-on: ubuntu-24.04
    env:
      # Also proves the docs.rs path, which skips the OR-Tools download and the bridge build.
      DOCS_RS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - run: just doc

  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: extractions/setup-just@v4
      - run: just check-proto
      - uses: taiki-e/install-action@v2
        with:
          tool: bindgen-cli
      - run: sudo apt-get install -y --no-install-recommends libclang-dev
      - run: just check-bindings
      - name: The Buffa plugin matches the buffa crate
        run: |
          plugin=$(sed -n 's|.*buf.build/anthropics/buffa:v\(.*\)|\1|p' crates/cpsat/proto/buf.gen.yaml)
          grep -qx "buffa = \"$plugin\"" Cargo.toml
      - name: Vendored protos match the pinned OR-Tools tag
        run: |
          tag=$(sed -n 's|.*/archive/refs/tags/\(v[0-9.]*\)\.tar\.gz.*|\1|p' crates/cpsat-sys/build/artifacts.rs)
          for proto in cp_model sat_parameters; do
            curl -fsSL "https://raw.githubusercontent.com/google/or-tools/$tag/ortools/sat/$proto.proto" |
              diff - "crates/cpsat/proto/ortools/sat/$proto.proto"
          done

  fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # no major-version tag exists
      - uses: extractions/setup-just@v4
      - name: The fixture pin matches the pinned OR-Tools tag
        run: |
          tag=$(sed -n 's|.*/archive/refs/tags/v\([0-9.]*\)\.tar\.gz.*|\1|p' crates/cpsat-sys/build/artifacts.rs)
          grep -q -- "--with ortools==$tag\." justfile
      - run: just check-fixtures

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          # The newest supported system, for compiler and glibc regressions.
          - name: ubuntu-26.04
            os: ubuntu-24.04
            container: ubuntu:26.04
            setup: |
              apt-get update
              apt-get install -y --no-install-recommends build-essential ca-certificates curl git
          # The oldest: the OR-Tools archive targets AlmaLinux 8 (glibc 2.28),
          # and GCC 11 is the oldest compiler the README supports.
          - name: almalinux-8
            os: ubuntu-24.04
            container: almalinux:8
            setup: |
              dnf install -y findutils git tar gcc-toolset-11-gcc-c++
              echo /opt/rh/gcc-toolset-11/root/usr/bin >> "$GITHUB_PATH"
              echo CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER=/opt/rh/gcc-toolset-11/root/usr/bin/gcc >> "$GITHUB_ENV"
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install the toolchain in the container
        if: matrix.container
        run: |
          ${{ matrix.setup }}
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .cpsat-cache
          key:
            ortools-${{ runner.os }}-${{
            hashFiles('crates/cpsat-sys/build/artifacts.rs') }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --locked --workspace --features cpsat/json
      # Copies the runtime directory beside the executable, as docs/build.md
      # describes, and runs it without Cargo's library path.
      - name: Run from a directory with only the runtime beside it
        shell: bash
        run: |
          # Match both the legacy and the Cargo 1.100 build-dir layouts.
          runtime=$(find target/debug/build -type d -name runtime -path '*cpsat-sys*/out/*' | head -n 1)
          test -d "$runtime/licenses"
          mkdir ship
          cp -a "$runtime"/. ship/
          cp target/debug/examples/solve$([ "$RUNNER_OS" = Windows ] && echo .exe) ship/
          cd ship && ./solve
      - name: ORTOOLS_ROOT links the extracted archive
        if: matrix.name == 'ubuntu-26.04'
        shell: bash
        run: |
          root=$(find "$CPSAT_CACHE_DIR/extracted" -mindepth 2 -maxdepth 2 -type d | head -n 1)
          ORTOOLS_ROOT="$root" cargo run --locked -p cpsat --example solve
