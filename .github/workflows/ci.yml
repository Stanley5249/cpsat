name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CPSAT_CACHE_DIR: ${{ github.workspace }}/.cpsat-cache

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # no major-version tag exists
      - uses: oven-sh/setup-bun@v2
      - uses: extractions/setup-just@v4
      - run: cargo fmt --all --check
      - run: uvx tombi@1.8.4 format --check .
      - run: bunx oxfmt --check
      - run: just --fmt --check

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .cpsat-cache
          key:
            ortools-${{ runner.os }}-${{
            hashFiles('crates/cpsat-sys/build/artifacts.rs') }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  docs:
    runs-on: ubuntu-24.04
    env:
      # Also proves the docs.rs path, which builds without native work.
      DOCS_RS: "1"
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --workspace --no-deps

  generated:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf generate
        working-directory: crates/cpsat/proto
      - run: cargo fmt -p cpsat
      - run: git diff --exit-code -- crates/cpsat/src/proto
      - name: Vendored protos match the pinned OR-Tools tag
        run: |
          tag=$(sed -n 's/^pub const VERSION: &str = "\(.*\)";/\1/p' crates/cpsat-sys/build/artifacts.rs)
          for proto in cp_model sat_parameters; do
            curl -fsSL "https://raw.githubusercontent.com/google/or-tools/$tag/ortools/sat/$proto.proto" |
              diff - "crates/cpsat/proto/ortools/sat/$proto.proto"
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: ubuntu-24.04
            os: ubuntu-24.04
          - name: ubuntu-26.04
            os: ubuntu-24.04
            container: ubuntu:26.04
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install the toolchain in the container
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .cpsat-cache
          key:
            ortools-${{ runner.os }}-${{
            hashFiles('crates/cpsat-sys/build/artifacts.rs') }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --locked --workspace
      - name: Every shared library dependency resolves
        if: runner.os == 'Linux'
        shell: bash
        run: |
          runtime=$(find target/debug/build -type d -path '*cpsat-sys-*/out/runtime' | head -n 1)
          for binary in target/debug/deps/solve-*; do
            [ -x "$binary" ] || continue
            ! LD_LIBRARY_PATH="$runtime" ldd "$binary" | grep 'not found'
          done
