name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Runs a task branch on demand without opening a pull request.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CPSAT_CACHE_DIR: ${{ github.workspace }}/.cpsat-cache

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --all --check

  tombi:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0 # no major-version tag exists
      - run: uvx tombi@1.8.4 format --quiet --check .

  oxfmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bunx oxfmt --check

  just-fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - run: just --fmt --check

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .cpsat-cache
          key:
            ortools-${{ runner.os }}-${{
            hashFiles('crates/cpsat-sys/build/artifacts.rs') }}
      - uses: Swatinem/rust-cache@v2
      - run:
          cargo clippy --quiet --locked --workspace --all-targets --all-features
          -- -D warnings

  docs:
    runs-on: ubuntu-24.04
    env:
      # Also proves the docs.rs path, which skips the OR-Tools download and the bridge build.
      DOCS_RS: "1"
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --workspace --all-features --no-deps

  proto:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: extractions/setup-just@v4
      - run: just proto-check
      - name: Vendored protos match the pinned OR-Tools tag
        run: |
          tag=$(sed -n 's|.*/archive/refs/tags/\(v[0-9.]*\)\.tar\.gz.*|\1|p' crates/cpsat-sys/build/artifacts.rs)
          for proto in cp_model sat_parameters; do
            curl -fsSL "https://raw.githubusercontent.com/google/or-tools/$tag/ortools/sat/$proto.proto" |
              diff - "crates/cpsat/proto/ortools/sat/$proto.proto"
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: ubuntu-22.04
            os: ubuntu-22.04
          - name: ubuntu-24.04
            os: ubuntu-24.04
          - name: debian-12
            os: ubuntu-24.04
            container: debian:12
          - name: ubuntu-26.04
            os: ubuntu-24.04
            container: ubuntu:26.04
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install the toolchain in the container
        if: matrix.container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: .cpsat-cache
          key:
            ortools-${{ runner.os }}-${{
            hashFiles('crates/cpsat-sys/build/artifacts.rs') }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --locked --workspace --all-features
      - name: Every shared library dependency resolves
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Match both the legacy and the Cargo 1.100 build-dir layouts.
          runtime=$(find target/debug/build -type d -name runtime -path '*cpsat-sys*/out/*' | head -n 1)
          status=0
          for binary in $(find target/debug/deps -maxdepth 1 -type f -executable); do
            output=$(LD_LIBRARY_PATH="$runtime" ldd "$binary")
            if grep -q 'not found' <<<"$output"; then
              echo "$binary"; echo "$output"; status=1
            fi
          done
          exit $status
      - name: The dir mode links the extracted archive
        if: matrix.name == 'ubuntu-24.04'
        shell: bash
        run: |
          root=$(find "$CPSAT_CACHE_DIR/extracted" -mindepth 2 -maxdepth 2 -type d | head -n 1)
          CPSAT_ORTOOLS="dir:$root" cargo test --locked --workspace --all-features
