[package]
name = "cpsat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust binding for the OR-Tools CP-SAT solver"
repository.workspace = true
license.workspace = true

[dependencies]
buffa.workspace = true
cpsat-sys.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["text", "views"]
# Proto3 JSON through serde.
json = ["buffa/json", "dep:serde"]
# Protobuf text format through buffa::text.
text = ["buffa/text"]
# Required. Buffa gates views together with the optional formats, and the
# solver passes solutions as views.
views = []

[lints]
workspace = true
