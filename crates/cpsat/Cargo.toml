[package]
name = "cpsat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Rust binding for the OR-Tools CP-SAT solver"
readme = "../../README.md"
repository.workspace = true
license.workspace = true
keywords = ["constraint", "cp-sat", "optimization", "or-tools", "solver"]
categories = ["algorithms", "api-bindings", "mathematics", "science"]

[dependencies]
buffa.workspace = true
cpsat-sys.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[features]
default = ["download-libortools", "text", "views"]
# See the cpsat-sys features.
build-libortools = ["cpsat-sys/build-libortools"]
download-libortools = ["cpsat-sys/download-libortools"]
# Proto3 JSON through serde.
json = ["buffa/json", "dep:serde"]
# Protobuf text format through buffa::text.
text = ["buffa/text"]
# Required. Buffa gates views together with the optional formats, and
# solution callbacks read views.
views = []

[lints]
workspace = true
