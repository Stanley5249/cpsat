[package]
name = "cpsat-sys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "C ABI bridge to the OR-Tools CP-SAT solver"
readme = "../../README.md"
repository.workspace = true
license.workspace = true
keywords = ["cp-sat", "ffi", "or-tools", "solver"]
categories = ["algorithms", "external-ffi-bindings"]
links = "ortools"

[build-dependencies]
anyhow.workspace = true
cc.workspace = true
sha2.workspace = true

[features]
default = ["download-libortools"]
# Build OR-Tools from source with CMake. Wins over download-libortools.
build-libortools = []
# Download the official OR-Tools release.
download-libortools = []

[lints]
workspace = true
