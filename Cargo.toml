[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/Stanley5249/cpsat"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0.100"
buffa = "0.9.2"
cc = "1.2"
cpsat-sys = { path = "crates/cpsat-sys", version = "0.1.0" }
serde = "1.0.228"
serde_json = "1.0.145"
sha2 = "0.10"
thiserror = "2.0.17"

[workspace.lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
pedantic = { level = "warn", priority = -1 }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
